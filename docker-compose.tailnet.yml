# Enable only after completing administrator initialization locally.
# No wildcard/public interface is published. Requires Tailscale on this host.
services:
  # Bridge only this application's traffic to the host's existing loopback
  # proxy. No host proxy configuration is changed and no public port is bound.
  # In the Codex channel, set proxy to http://NEW_API_EGRESS_BIND:NEW_API_EGRESS_PORT.
  codex-egress:
    image: ${SOCAT_IMAGE:?Set a pinned socat image in .env}
    restart: always
    network_mode: host
    user: "65534:65534"
    command:
      - "TCP4-LISTEN:${NEW_API_EGRESS_PORT:-17890},bind=${NEW_API_EGRESS_BIND:?Set the project ingress gateway},reuseaddr,fork,range=${NEW_API_BACKEND_IP:?Set NEW_API_BACKEND_IP}/32"
      - "TCP4:127.0.0.1:${NEW_API_HOST_PROXY_PORT:-7890},connect-timeout=10"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      new-api:
        condition: service_healthy
    healthcheck:
      # socat is PID 1; a bind failure exits and triggers restart. Also check
      # that the existing host proxy is listening, without sending credentials.
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 ${NEW_API_HOST_PROXY_PORT:-7890}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  new-api:
    ports:
      - "${TAILSCALE_IP:?Set this host's Tailscale IPv4}:${NEW_API_PORT:-3000}:3000"
    environment:
      # Only our proxy may supply the client's forwarded IP address.
      TRUSTED_PROXIES: "${NEW_API_PROXY_IP:?Set NEW_API_PROXY_IP}/32"
    networks:
      default: {}
      ingress:
        ipv4_address: ${NEW_API_BACKEND_IP:?Set NEW_API_BACKEND_IP}

  proxy:
    image: ${CADDY_IMAGE:?Set a pinned Caddy image in .env}
    restart: always
    user: "1000:1000"
    ports:
      - "${TAILSCALE_IP:?Set this host's Tailscale IPv4}:80:8080"
    environment:
      NEW_API_HOSTNAME: ${NEW_API_HOSTNAME:?Set the DNS name pointing to TAILSCALE_IP}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700,size=8m
      - /data:uid=1000,gid=1000,mode=0700,size=8m
    cap_drop: ["ALL"]
    # The official Caddy executable carries this file capability.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      ingress:
        ipv4_address: ${NEW_API_PROXY_IP:?Set NEW_API_PROXY_IP}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header=\"Host: $$NEW_API_HOSTNAME\" http://127.0.0.1:8080/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress:
    # Reserve a project-only subnet; check host/Docker/Tailscale routes first.
    ipam:
      config:
        - subnet: ${NEW_API_PROXY_SUBNET:?Set an unused subnet for the proxy}
